<template>
    <button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme" aria-pressed="false">
        <span class="theme-pill">
            <span class="theme-knob"></span>
        </span>
        <span id="themeLabel" class="theme-label">Light</span>
    </button>
</template>

<style>
    :host {
        display: inline-flex;
        align-items: center;
    }

    .theme-toggle {
        display: inline-flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.35rem 0.6rem;
        border: 1px solid rgba(212, 175, 55, 0.35);
        border-radius: 999px;
        background: rgba(0, 30, 0, 0.55);
        color: #f5e9b0;
        cursor: pointer;
        font: inherit;
        transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .theme-toggle:hover {
        border-color: rgba(212, 175, 55, 0.8);
        transform: translateY(-1px);
    }

    .theme-pill {
        position: relative;
        width: 2.2rem;
        height: 1.2rem;
        border-radius: 999px;
        background: linear-gradient(90deg, #f0d060 0%, #d4af37 100%);
        box-shadow: inset 0 0 0 1px rgba(7, 20, 0, 0.16);
    }

    .theme-knob {
        position: absolute;
        top: 0.12rem;
        left: 0.12rem;
        width: 0.96rem;
        height: 0.96rem;
        border-radius: 50%;
        background: #fff;
        box-shadow: inset 0 -2px 4px rgba(0, 0, 0, 0.18);
        transition: transform 0.2s ease;
    }

    .theme-toggle[data-theme="dark"] .theme-pill {
        background: linear-gradient(90deg, #173012 0%, #0d2a0b 100%);
    }

    .theme-toggle[data-theme="dark"] .theme-knob {
        transform: translateX(1rem);
        background: #f5e9b0;
    }

    .theme-label {
        font-size: 0.72rem;
        letter-spacing: 0.18em;
        text-transform: uppercase;
        color: #cce89a;
    }
</style>

<script>
    const toggle = shadowDocument.getElementById('themeToggle');
    const label = shadowDocument.getElementById('themeLabel');

    function renderTheme(theme) {
        const isDark = theme === 'dark';
        toggle.dataset.theme = theme;
        toggle.setAttribute('aria-pressed', String(isDark));
        label.textContent = isDark ? 'Dark' : 'Light';
    }

    function onToggleClick() {
        const nextTheme = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
        renderTheme(nextTheme);
        window.dispatchEvent(new CustomEvent('app:theme-change', { detail: { theme: nextTheme } }));
    }

    toggle.addEventListener('click', onToggleClick);
    window.addEventListener('app:theme-change', e => {
        renderTheme(e.detail?.theme || 'light');
    });

    renderTheme(document.documentElement.dataset.theme || localStorage.getItem('app-theme') || 'light');
</script>
