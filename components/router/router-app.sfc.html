<template>
    <header class="navbar">
        <div class="navbar-container">
            <div class="navbar-brand">
                <a href="/" class="home-link"><span class="logo">Jahrome</span></a>
            </div>
            <div class="navbar-actions">
                <theme-switch></theme-switch>
                <router-hamburger></router-hamburger>
            </div>
            <nav class="nav-menu">
                <ul>
                    <li><a href="/about" class="nav-link">About</a></li>
                    <li><a href="/persistence" class="nav-link">Persistence</a></li>
                    <li><a href="/dragndrop" class="nav-link">Drag & Drop</a></li>
                </ul>
            </nav>
        </div>
    </header>
    <main class="main-content"></main>
</template>

<script>
    (function patchPushStateIIFE(history) { // to fire pushstate-Event on pushState
        const pushStateOriginal = history.pushState;
        history.pushState = function patchedPushState(state, unused, url) {
            pushStateOriginal.call(history, state, unused, url);
            dispatchEvent(new Event('pushstate'));
        };
    })(window.history);

    let _sitemap = [
        { "title": "Home", "template": "home-page" },
        {
            "about": { "title": "About", "template": "about-me" },
            "persistence": { "title": "Persistence", "template": "sqlite-workers" },
            "dragndrop": { "title": "DragnDrop", "template": "dragndrop-container" },
        }
    ];

    let errorMapping = { "template": "error-404" };

    function getMapping(pathname) { // "/project/plan"
        let level = 0;
        let mapping = _sitemap[level]; // { "template": "home-page" }
        let resources = pathname.split("/"); // ["", "project", "plan"]
        let step = resources[level]; // ""
        let lastStep = step;
        if (pathname == "/") {
            return mapping;
        }

        while (++level < resources.length) {
            step = resources[level]; // "plan"
            if (level == 1) {
                if (step in _sitemap[level]) {
                    mapping = _sitemap[level][step];
                } else {
                    mapping = errorMapping;
                }
            } else {
                if (step in _sitemap[level][lastStep]) {
                    mapping = _sitemap[level][lastStep][step];
                } else {
                    mapping = errorMapping;
                }
            }
            lastStep = step;
        }

        if (!customElements.get(mapping.template)) { return errorMapping; }
        return mapping;
    }

    const main = shadowDocument.querySelector(".main-content");
    const hostEl = shadowDocument.host;
    const storageKey = 'app-theme';

    function syncThemeToElement(el) {
        if (!el) return;
        const theme = localStorage.getItem(storageKey) || 'light';
        el.classList.toggle('theme-dark', theme === 'dark');
        el.classList.toggle('theme-light', theme === 'light');
        el.dataset.theme = theme;
    }

    function applyTheme(theme) {
        const nextTheme = theme === 'dark' ? 'dark' : 'light';
        const previousTheme = document.documentElement.dataset.theme || localStorage.getItem(storageKey) || 'light';
        localStorage.setItem(storageKey, nextTheme);
        document.documentElement.classList.toggle('dark', nextTheme === 'dark');
        document.documentElement.classList.toggle('theme-dark', nextTheme === 'dark');
        document.documentElement.classList.toggle('theme-light', nextTheme === 'light');
        document.documentElement.dataset.theme = nextTheme;
        document.documentElement.style.colorScheme = nextTheme;
        hostEl.classList.toggle('theme-dark', nextTheme === 'dark');
        hostEl.classList.toggle('theme-light', nextTheme === 'light');
        hostEl.dataset.theme = nextTheme;
        Array.from(main.children).forEach(syncThemeToElement);
        if (previousTheme !== nextTheme) {
            window.dispatchEvent(new CustomEvent('app:theme-change', { detail: { theme: nextTheme } }));
        }
    }

    function loadContent(e) {
        let mapping = getMapping(location.pathname);
        const nextComponent = document.createElement(mapping.template);
        syncThemeToElement(nextComponent);
        main.replaceChildren(nextComponent);
    }

    function activate(e) {
        shadowDocument.querySelector(".nav-link.active")?.classList.remove("active");
        for (let a of shadowDocument.querySelectorAll('.nav-link')) {
            if (location.pathname.includes(a.getAttribute("href"))) {
                a.classList.add("active");
                break;
            }
        }
    }

    applyTheme(localStorage.getItem(storageKey) || 'light');
    loadContent();
    addEventListener("popstate", loadContent);
    addEventListener("pushstate", loadContent);

    activate();
    addEventListener("popstate", activate);
    addEventListener("pushstate", activate);

    const hamburger = shadowDocument.querySelector("router-hamburger");
    const navMenu = shadowDocument.querySelector(".nav-menu");
    window.addEventListener('app:theme-change', e => {
        applyTheme(e.detail?.theme || 'light');
    });
    hamburger.addEventListener("click", function onHamburgerClicked(e) {
        e.preventDefault();
        hamburger.classList.toggle("open");
        navMenu.classList.toggle("open");
    });

    function onLinkClick(e) {
        e.preventDefault();
        e.stopImmediatePropagation();
        let a = e.target.closest("a");
        let pathname = a.getAttribute("href");
        link(pathname);
    }

    eventbus.addEventListener('router:link', linkEvent, shadowDocument.host);

    function linkEvent(e) {
        link(e.detail.pathname);
    }
    function link(pathname) {
        console.log({pathname});
        let mapping = getMapping(pathname);
        console.log({ mapping });
        history.pushState(mapping.template, mapping.title, pathname);
    }
    const links = shadowDocument.querySelectorAll(".nav-link, .home-link");
    links.forEach(a => {
        a.addEventListener("click", onLinkClick);
    });

    // workaround to access at least the first routing level when url entered into browser's address bar 
    // const resources = (location.pathname).split("/");
    // if (resources.length > 2) { push(resources.slice(0, 2).join("/")); }
</script>

<style>
    :host {
        --bg: #071400;
        --bg-panel: rgba(0, 30, 0, 0.85);
        --border: rgba(180, 150, 30, 0.55);
        --border-bright: rgba(212, 175, 55, 0.75);
        --accent: #d4af37;
        --accent-light: #f0d060;
        --text: #f5e9b0;
        --text-muted: #cce89a;
        --text-faint: #7aaa50;
        display: block;
        font-family: 'DM Mono', monospace;
    }

    .navbar {
        position: sticky;
        top: 0;
        z-index: 100;
        border-bottom: 1px solid var(--border);
        background: linear-gradient(135deg, rgba(8, 22, 0, 0.98) 0%, rgba(12, 35, 0, 0.97) 100%);
        box-shadow: 0 12px 40px rgba(0, 0, 0, 0.32);
        backdrop-filter: blur(8px);
    }

    .navbar-container {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 60px;
        padding: 0 1rem;
        gap: 0.75rem;
    }

    .navbar-brand {
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: 0.12em;
        text-transform: uppercase;
    }

    .home-link {
        text-decoration: none;
        color: var(--text);
    }

    .logo {
        color: var(--accent-light);
    }

    .navbar-actions {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        margin-left: auto;
    }

    :host(.theme-dark) {
        --bg: #071400;
        --bg-panel: rgba(0, 30, 0, 0.85);
        --border: rgba(180, 150, 30, 0.55);
        --border-bright: rgba(212, 175, 55, 0.75);
        --accent: #d4af37;
        --accent-light: #f0d060;
        --text: #f5e9b0;
        --text-muted: #cce89a;
        --text-faint: #7aaa50;
    }

    :host(.theme-light) {
        --bg: #f7f3e8;
        --bg-panel: rgba(255, 255, 255, 0.92);
        --border: rgba(73, 96, 64, 0.2);
        --border-bright: rgba(79, 125, 88, 0.35);
        --accent: #4f7d58;
        --accent-light: #2f5b3c;
        --text: #17301d;
        --text-muted: #385443;
        --text-faint: #6a7f6c;
    }

    .navbar {
        background: linear-gradient(135deg, var(--bg-panel) 0%, var(--bg) 100%);
        color: var(--text);
    }

    .nav-menu {
        position: fixed;
        inset: 60px 0 auto 0;
        background: var(--bg-panel);
        border-top: 1px solid var(--border);
        border-bottom: 1px solid var(--border);
        transform: translateX(-100%);
        transition: transform 0.25s ease;
        backdrop-filter: blur(8px);
        z-index: 99;
    }

    .nav-menu.open {
        transform: translateX(0);
    }

    .nav-menu ul {
        list-style: none;
        margin: 0;
        padding: 0;
    }

    .nav-menu li + li {
        border-top: 1px solid rgba(212, 175, 55, 0.16);
    }

    .nav-link {
        display: block;
        padding: 0.95rem 1rem;
        color: var(--text-muted);
        text-decoration: none;
        transition: background 0.2s ease, color 0.2s ease;
    }

    .nav-link:hover,
    .nav-link.active {
        background: rgba(212, 175, 55, 0.1);
        color: var(--accent-light);
    }

    .main-content {
        width: 100%;
        margin: 0 auto;
    }

    @media (min-width: 769px) {
        .navbar-container {
            height: 70px;
            padding: 0 1.5rem;
        }

        .nav-menu {
            position: static;
            display: flex;
            align-items: center;
            background: transparent;
            border: 0;
            transform: none;
            backdrop-filter: none;
        }

        .nav-menu ul {
            display: flex;
            gap: 0.35rem;
        }

        .nav-menu li + li {
            border-top: 0;
        }

        .nav-link {
            padding: 0.6rem 0.9rem;
            border-radius: 999px;
            border: 1px solid transparent;
        }

        .nav-link.active {
            border-color: var(--border-bright);
        }
    }
</style>
