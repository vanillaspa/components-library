<template>
    <div class="datepicker-wrap">
        <p class="input-label">Datum</p>
        <div class="input-wrap">
            <input class="field" id="triggerInput" type="text" placeholder="TT.MM.JJJJ" maxlength="10"
                autocomplete="off" spellcheck="false" />
            <span class="input-icon hidden" id="triggerIcon"></span>
        </div>
    </div>
    <datepicker-modal></datepicker-modal>
</template>

<script>
    const triggerInput = shadowDocument.getElementById('triggerInput');
    const triggerIcon = shadowDocument.getElementById('triggerIcon');


    const DATE_REGEX = /^(((0?[1-9]|1[0-9]|2[0-8])\.(0?[1-9]|1[0-2])|(29|30)\.(0?[1,3-9]|1[0-2])|31\.(0?[13578]|1[02]))\.(19|20)?[0-9]{2}|29\.0?2\.(19|20)?(0[048]|[2468][048]|[13579][26]))$/;


    // ── Detect modal presence and configure mode ─────────────
    // Check both the shadow DOM (modal embedded in template) and the light DOM
    const modalEl = shadowDocument.querySelector('datepicker-modal') || document.querySelector('datepicker-modal');


    if (modalEl) {
        // ── Modal mode: readonly, dispatches directly on the modal element ─
        triggerInput.readOnly = true;
        triggerInput.style.cursor = 'pointer';
        triggerInput.style.caretColor = 'transparent';


        function requestOpen() {
            modalEl.dispatchEvent(new CustomEvent('datepicker:open', {
                detail: { value: triggerInput.value }
            }));
        }


        triggerInput.addEventListener('click', requestOpen);
        triggerInput.addEventListener('keydown', e => {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); requestOpen(); }
        });


        // Listen for select dispatched back directly on the modal element
        modalEl.addEventListener('datepicker:select', e => {
            const v = e.detail.value;
            triggerInput.value = v;
            updateTrigger(v);
        });
    } else {
        // ── Standalone mode: editable with inline formatting ──
        triggerInput.addEventListener('input', e => {
            const input = e.target, raw = input.value;
            const isInserting = !e.inputType || e.inputType.startsWith('insert');


            let v = raw.replace(/[^0-9.]/g, '').replace(/\.{2,}/g, '.');
            const parts = v.split('.');
            if (parts.length > 3) v = parts[0] + '.' + parts[1] + '.' + parts.slice(2).join('');
            const [d, m, y] = v.split('.');
            v = [d?.slice(0, 2), m?.slice(0, 2), y?.slice(0, 4)].filter(s => s !== undefined).join('.');


            if (isInserting) {
                const dotCount = (v.match(/\./g) || []).length;
                if (dotCount === 0 && v.length === 2) v += '.';
                if (dotCount === 1 && v.length === 5 && !v.endsWith('.')) v += '.';
            }


            if (input.value !== v) {
                const cursor = input.selectionStart + (v.length - raw.length);
                input.value = v;
                input.setSelectionRange(cursor, cursor);
            }


            updateTrigger(v);
        });
    }


    // ── Trigger state ────────────────────────────────────────
    function updateTrigger(v) {
        const valid = DATE_REGEX.test(v);
        triggerInput.classList.toggle('valid', valid);
        triggerInput.classList.toggle('invalid', !valid && v.length >= 8);
        if (valid) {
            setIcon(triggerIcon, '✓', 'var(--green)');
        } else if (v.length === 0) {
            triggerIcon.classList.add('hidden');
            triggerInput.classList.remove('valid', 'invalid');
        }
    }


    function setIcon(el, char, color) { el.textContent = char; el.style.color = color; el.classList.remove('hidden'); }
</script>
