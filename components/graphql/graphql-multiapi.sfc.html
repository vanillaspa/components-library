<script>
  const { GraphQLSchema, GraphQLObjectType, GraphQLList, GraphQLNonNull,
          GraphQLString, GraphQLInt, GraphQLFloat, GraphQLBoolean, graphql }
    = graphqlmod;

  const { createDB, executeQuery, executeStatement, getWorkers } = sqlite;

  // ── Type mapping ───────────────────────────────────────────────────────────
  const toScalar = (t = '') => {
    t = t.toUpperCase();
    if (t.includes('INT'))                                            return GraphQLInt;
    if (t.includes('REAL')||t.includes('FLOAT')||t.includes('NUM'))  return GraphQLFloat;
    if (t.includes('BOOL'))                                           return GraphQLBoolean;
    return GraphQLString;
  };

  const getTables = async db => {
    const rows = await executeQuery(
      `SELECT name FROM sqlite_master WHERE type='table' AND name NOT LIKE 'sqlite_%' ORDER BY name`,
      db
    );
    return rows.map(r => r[0]);
  };

  const getCols = async (table, db) => {
    const rows = await executeQuery(`PRAGMA table_info(${JSON.stringify(table)})`, db);
    return rows.map(r => ({ cid:r[0], name:r[1], type:r[2], notnull:r[3], dflt_value:r[4], pk:r[5] }));
  };

  // ── Schema builder — merges ALL open workers into one schema ───────────────
  // Table names are prefixed with db name to avoid collisions:
  // db "analytics", table "events" → GraphQL type "AnalyticsEvents", field "analytics_events"
  const buildMergedSchema = async () => {
    const workers = getWorkers(); // Map<dbName, Worker>
    if (!workers.size) return new GraphQLSchema({
      query: new GraphQLObjectType({
        name: 'Query',
        fields: { _hint: { type: GraphQLString, resolve: () => 'No databases open.' } }
      })
    });

    const qFields = {};
    const mFields = {};

    for (const dbName of workers.keys()) {
      const tables = await getTables(dbName);

      // rawSQL per db: rawSQL_mydb(sql: "...")
      qFields[`rawSQL_${dbName}`] = {
        type: GraphQLString,
        description: `Run raw SQL against "${dbName}"`,
        args: { sql: { type: new GraphQLNonNull(GraphQLString) } },
        resolve: (_, { sql }) =>
          executeQuery(sql, dbName)
            .then(r => JSON.stringify(r, null, 2))
            .catch(e => JSON.stringify({ error: e.message }))
      };

      for (const t of tables) {
        const cols  = await getCols(t, dbName);
        const pk    = cols.find(c => c.pk) || cols[0];

        // Unique GraphQL type name: "AnalyticsEvents"
        const typeName  = dbName[0].toUpperCase() + dbName.slice(1) + '_' + t[0].toUpperCase() + t.slice(1);
        // Field name: "analytics_events"
        const fieldName = `${dbName}_${t}`;
        const tq        = JSON.stringify(t);

        const T = new GraphQLObjectType({
          name: typeName,
          description: `Table "${t}" from database "${dbName}"`,
          fields: Object.fromEntries(cols.map(c => [
            c.name, {
              type: c.notnull ? new GraphQLNonNull(toScalar(c.type)) : toScalar(c.type),
              description: c.pk ? '🔑 Primary Key' : (c.type || 'TEXT')
            }
          ]))
        });

        // list
        qFields[fieldName] = {
          type: new GraphQLList(T),
          description: `List rows from "${t}" in "${dbName}"`,
          args: {
            limit:   { type: GraphQLInt,    defaultValue: 100 },
            offset:  { type: GraphQLInt,    defaultValue: 0 },
            where:   { type: GraphQLString, description: 'SQL WHERE clause (without WHERE keyword)' },
            orderBy: { type: GraphQLString, description: 'Column to order by' },
            order:   { type: GraphQLString, defaultValue: 'ASC', description: 'ASC or DESC' }
          },
          resolve: (_, { limit, offset, where, orderBy, order }) => {
            let sql = `SELECT * FROM ${tq}`;
            if (where)   sql += ` WHERE ${where}`;
            if (orderBy) sql += ` ORDER BY ${JSON.stringify(orderBy)} ${order === 'DESC' ? 'DESC' : 'ASC'}`;
            sql += ` LIMIT $1 OFFSET $2`;
            return executeStatement(sql, [limit, offset], dbName);
          }
        };

        // single by pk
        if (pk) {
          const singleName = `${dbName}_${t.endsWith('s') ? t.slice(0, -1) : t + 'ById'}`;
          qFields[singleName] = {
            type: T,
            args: { [pk.name]: { type: new GraphQLNonNull(toScalar(pk.type)) } },
            resolve: (_, args) =>
              executeStatement(
                `SELECT * FROM ${tq} WHERE ${JSON.stringify(pk.name)} = $1 LIMIT 1`,
                [args[pk.name]], dbName
              ).then(r => r[0] || null)
          };
        }

        // insert
        const MutName = typeName;
        mFields[`insert_${fieldName}`] = {
          type: T,
          description: `Insert into "${t}" in "${dbName}"`,
          args: Object.fromEntries(cols.filter(c => !c.pk).map(c => [
            c.name, { type: c.notnull ? new GraphQLNonNull(toScalar(c.type)) : toScalar(c.type) }
          ])),
          resolve: (_, args) => {
            const keys = Object.keys(args);
            const ph   = keys.map((_, i) => `$${i + 1}`).join(', ');
            const sql  = `INSERT INTO ${tq} (${keys.map(k => JSON.stringify(k)).join(', ')}) VALUES (${ph}) RETURNING *`;
            return executeStatement(sql, Object.values(args), dbName).then(r => r[0] || null);
          }
        };

        // delete
        if (pk) {
          const delFieldName = `delete_${dbName}_${t.endsWith('s') ? t.slice(0,-1) : t}`;
          mFields[delFieldName] = {
            type: GraphQLBoolean,
            description: `Delete from "${t}" in "${dbName}"`,
            args: { [pk.name]: { type: new GraphQLNonNull(toScalar(pk.type)) } },
            resolve: (_, args) =>
              executeStatement(
                `DELETE FROM ${tq} WHERE ${JSON.stringify(pk.name)} = $1`,
                [args[pk.name]], dbName
              ).then(() => true)
          };
        }
      }
    }

    // Always have at least one query field
    if (!Object.keys(qFields).length) {
      qFields['_hint'] = { type: GraphQLString, resolve: () => 'No tables found in any open database.' };
    }

    return new GraphQLSchema({
      query: new GraphQLObjectType({ name: 'Query', fields: qFields }),
      ...(Object.keys(mFields).length && {
        mutation: new GraphQLObjectType({ name: 'Mutation', fields: mFields })
      })
    });
  };

  // ── Seed demo data ─────────────────────────────────────────────────────────
  const seedIfEmpty = async db => {
    if ((await getTables(db)).length) return;
    if (db === 'graphiql' || db === 'main') {
      await executeQuery(`CREATE TABLE IF NOT EXISTS users (id INTEGER PRIMARY KEY AUTOINCREMENT, name TEXT NOT NULL, email TEXT NOT NULL UNIQUE, age INTEGER, created_at TEXT DEFAULT CURRENT_TIMESTAMP)`, db);
      await executeQuery(`CREATE TABLE IF NOT EXISTS posts (id INTEGER PRIMARY KEY AUTOINCREMENT, user_id INTEGER NOT NULL, title TEXT NOT NULL, content TEXT, views INTEGER DEFAULT 0, created_at TEXT DEFAULT CURRENT_TIMESTAMP)`, db);
      await executeQuery(`INSERT OR IGNORE INTO users (id,name,email,age) VALUES (1,'Alice','alice@example.com',28),(2,'Bob','bob@example.com',35),(3,'Charlie','charlie@example.com',42)`, db);
      await executeQuery(`INSERT OR IGNORE INTO posts (id,user_id,title,content,views) VALUES (1,1,'Hello GraphQL','Intro post',1200),(2,2,'SQLite im Browser','WASM rocks',2043),(3,1,'Web Components','Reusable UI',856)`, db);
    } else {
      // Generic seed for additional DBs
      await executeQuery(`CREATE TABLE IF NOT EXISTS entries (id INTEGER PRIMARY KEY AUTOINCREMENT, label TEXT NOT NULL, value REAL, created_at TEXT DEFAULT CURRENT_TIMESTAMP)`, db);
      await executeQuery(`INSERT OR IGNORE INTO entries (id,label,value) VALUES (1,'alpha',1.5),(2,'beta',2.7),(3,'gamma',0.9)`, db);
    }
  };

  // ── DOM refs ───────────────────────────────────────────────────────────────
  const dbInput    = shadowDocument.querySelector('.db-input');
  const openBtn    = shadowDocument.querySelector('.open-btn');
  const textarea   = shadowDocument.querySelector('textarea');
  const runBtn     = shadowDocument.querySelector('.run-btn');
  const output     = shadowDocument.querySelector('.output');
  const schemaEl   = shadowDocument.querySelector('.schema-explorer');
  const workersEl  = shadowDocument.querySelector('.workers-list');

  let gqlSchema = null;

  // ── Render sidebar: worker pills + schema tree ─────────────────────────────
  const renderSidebar = async () => {
    const workers = getWorkers();

    // Worker pills
    workersEl.innerHTML = [...workers.keys()].map(db =>
      `<span class="db-pill">${db}</span>`
    ).join('') || '<span class="no-workers">none</span>';

    // Schema tree grouped by db
    let html = '';
    for (const db of workers.keys()) {
      const tables = await getTables(db);
      const tableItems = await Promise.all(tables.map(async t => {
        const cols = await getCols(t, db);
        const fields = cols.map(c =>
          `<span class="field">${c.pk ? '🔑' : '◦'} ${c.name}: <em>${c.type || 'TEXT'}</em></span>`
        ).join('');
        return `<div class="type-block">
          <strong>${db}_${t}</strong>
          ${fields}
        </div>`;
      }));
      html += `<div class="db-group">
        <div class="db-group-label">${db}</div>
        ${tableItems.join('') || '<span class="field muted">no tables</span>'}
      </div>`;
    }
    schemaEl.innerHTML = html || '<em class="muted">No databases open</em>';
  };

  // ── Open a DB worker ───────────────────────────────────────────────────────
  const openDB = async () => {
    const db = dbInput.value.trim();
    if (!db) return;
    try {
      await createDB(db);
      await seedIfEmpty(db);
      gqlSchema = await buildMergedSchema();
      await renderSidebar();
      dbInput.value = '';
      dbInput.placeholder = `e.g. analytics`;
    } catch (e) {
      output.textContent = `❌ Error opening "${db}": ${e.message}`;
    }
  };

  // ── Execute GraphQL ────────────────────────────────────────────────────────
  const runQuery = async () => {
    if (!gqlSchema) { output.textContent = 'No schema — open a database first.'; return; }
    const src = textarea.value.trim();
    if (!src) { output.textContent = 'Enter a GraphQL query.'; return; }
    output.textContent = 'Executing…';
    try {
      const result = await graphql({ schema: gqlSchema, source: src });
      output.textContent = JSON.stringify(result, null, 2);
    } catch (e) {
      output.textContent = `Error: ${e.message}`;
    }
  };

  openBtn.addEventListener('click', openDB);
  runBtn.addEventListener('click', runQuery);
  textarea.addEventListener('keydown', e => {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') runQuery();
  });
  dbInput.addEventListener('keydown', e => { if (e.key === 'Enter') openDB(); });

  // Open default DB on mount
  dbInput.value = 'graphiql';
  await openDB();
</script>
