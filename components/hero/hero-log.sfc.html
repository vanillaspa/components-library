<template>
    <div class="wrap">
        <h3 class="title">📜 Event Log</h3>
        <ul id="log-list" class="list"></ul>
    </div>
</template>

<script>
    const { addEventListener: busListen } = window.eventbus;
    const { notifications } = window.HeroContract;
    const host   = shadowDocument.host;
    const listEl = shadowDocument.getElementById('log-list');

    busListen(notifications.LOG, (e) => {
        const { log } = e.detail;
        listEl.innerHTML = '';
        log.forEach((msg, i) => {
            const li = document.createElement('li');
            li.className  = 'entry' + (i === 0 ? ' latest' : '');
            li.textContent = msg;
            listEl.appendChild(li);
        });
    }, host);
</script>

<style>
    :host { display: block; flex: 1; }

    .wrap { display: flex; flex-direction: column; height: 100%; }

    .title {
        color: #3b82f6;
        margin: 0 0 0.4rem;
        font-size: 0.95rem;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        flex-shrink: 0;
    }

    .list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 0.2rem;
        overflow-y: auto;
        max-height: 260px;
        flex: 1;
    }

    .entry {
        font-size: 0.77rem;
        color: #6b7280;
        padding: 0.2rem 0.4rem;
        border-left: 2px solid #2a2a3e;
        border-radius: 0 0.2rem 0.2rem 0;
        line-height: 1.4;
    }

    .entry.latest {
        color: #e0e0e0;
        border-left-color: #3b82f6;
        background: #0d1428;
    }
</style>
