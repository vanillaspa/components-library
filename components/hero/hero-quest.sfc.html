<template>
    <div class="game-shell">
        <header class="game-header">
            <h1 class="game-title">⚔️ Hero Quest</h1>
            <div class="header-right">
                <button type="button" id="new-game-btn" class="btn btn-new">New Game</button>
                <button type="button" id="help-btn" class="btn btn-help">?</button>
            </div>
        </header>
        <div class="game-layout">
            <aside class="panel panel-left">
                <hero-player id="hq-player"></hero-player>
                <hero-inventory id="hq-inventory"></hero-inventory>
            </aside>
            <section class="panel panel-center">
                <hero-board id="hq-board"></hero-board>
            </section>
            <aside class="panel panel-right">
                <hero-combat id="hq-combat"></hero-combat>
                <hero-log id="hq-log"></hero-log>
            </aside>
        </div>
    </div>
    <div id="help-overlay" class="overlay hidden">
        <div class="overlay-box">
            <h2>How to Play</h2>
            <ul>
                <li>Click an adjacent tile on the board (↑ ↓ ← →) to move your hero.</li>
                <li>Walk into a <span class="tag">👹</span> tile to enter combat.</li>
                <li>Walk into a <span class="tag">🎁</span> tile to collect loot.</li>
                <li>Walk into a <span class="tag">🧪</span> tile to restore HP.</li>
                <li>Reach the <span class="tag">🚪</span> to advance to the next level.</li>
                <li>In combat, choose <strong>Attack</strong> or <strong>Flee</strong>.</li>
            </ul>
            <button type="button" id="close-help-btn" class="btn btn-help">Close</button>
        </div>
    </div>
</template>

<script>
    const { addEventListener: busListen, dispatchEvent: busDispatch, mountBridge, useContract } = window.eventbus;
    const { commands, notifications, reduceMove, reduceAttack, reduceFlee, reduceNewGame } = window.HeroContract;
    const host = shadowDocument.host;

    // ── SQLite persistence ────────────────────────────────────────────────────
    mountBridge(window.SqliteContract, host);
    const db = useContract(window.SqliteContract, host);

    await db.create({ name: 'heroquest' });
    await db.query({
        sql: `CREATE TABLE IF NOT EXISTS hero_save (
                  id       INTEGER PRIMARY KEY CHECK (id = 1),
                  data     TEXT    NOT NULL,
                  saved_at INTEGER NOT NULL
              )`,
        name: 'heroquest',
    });

    function saveState() {
        db.statement({
            sql:    `INSERT OR REPLACE INTO hero_save VALUES (1, $1, $2)`,
            values: [JSON.stringify(state), Date.now()],
            name:   'heroquest',
        }).catch(console.error);
    }

    async function loadState() {
        const { result } = await db.query({
            sql:  `SELECT data FROM hero_save LIMIT 1`,
            name: 'heroquest',
        });
        if (result?.[0]?.[0]) {
            try { state = JSON.parse(result[0][0]); } catch { /* keep default */ }
        }
    }

    // ── Game state ────────────────────────────────────────────────────────────
    let state = reduceNewGame();

    // ── Broadcast ─────────────────────────────────────────────────────────────
    // Dispatched without a routing context → true broadcast to all subscribers.
    function broadcast() {
        const { hero, floor, grid, player, combat } = state;
        busDispatch(new CustomEvent(notifications.STATE, { detail: { hero, floor, grid, player, combat } }));
        busDispatch(new CustomEvent(notifications.LOG,   { detail: { log: state.log } }));
    }

    function apply(newState) {
        state = newState;
        broadcast();
        saveState();
    }

    // ── Command listeners ─────────────────────────────────────────────────────
    // Children dispatch these; hero-quest is the sole subscriber per type.
    busListen(commands.MOVE,    (e) => apply(reduceMove(state, e.detail)),   host);
    busListen(commands.ATTACK,  ()  => apply(reduceAttack(state)),           host);
    busListen(commands.FLEE,    ()  => apply(reduceFlee(state)),             host);
    busListen(commands.NEWGAME, ()  => apply(reduceNewGame()),               host);

    // ── UI controls ───────────────────────────────────────────────────────────
    shadowDocument.getElementById('new-game-btn').addEventListener('click', () =>
        apply(reduceNewGame())
    );

    const helpOverlay = shadowDocument.getElementById('help-overlay');
    shadowDocument.getElementById('help-btn').addEventListener('click', () =>
        helpOverlay.classList.toggle('hidden')
    );
    shadowDocument.getElementById('close-help-btn').addEventListener('click', () =>
        helpOverlay.classList.add('hidden')
    );

    document.addEventListener('keydown', (e) => {
        const map = { ArrowUp: { dr: -1, dc: 0 }, ArrowDown: { dr: 1, dc: 0 }, ArrowLeft: { dr: 0, dc: -1 }, ArrowRight: { dr: 0, dc: 1 } };
        if (map[e.key]) { e.preventDefault(); apply(reduceMove(state, map[e.key])); }
    });

    // ── Bootstrap ─────────────────────────────────────────────────────────────
    await loadState();
    broadcast();
</script>
