<template>
    <div class="card">
        <div class="avatar">🧙</div>
        <div class="name-row">
            <span id="p-name"></span>
            <span id="p-level" class="badge-level"></span>
        </div>
        <div id="p-floor" class="floor-label"></div>

        <div class="stat-block">
            <label>HP</label>
            <div class="bar-track"><div id="p-hp-bar" class="bar-fill ok"></div></div>
            <span id="p-hp-text" class="bar-lbl"></span>
        </div>
        <div class="stat-block">
            <label>XP</label>
            <div class="bar-track"><div id="p-xp-bar" class="bar-fill xp"></div></div>
            <span id="p-xp-text" class="bar-lbl"></span>
        </div>

        <div class="stats-row">
            <div class="stat"><span>⚔️</span><span id="p-atk"></span></div>
            <div class="stat"><span>🛡️</span><span id="p-def"></span></div>
            <div class="stat"><span>🪙</span><span id="p-gold"></span></div>
        </div>
    </div>
</template>

<script>
    const { addEventListener: busListen } = window.eventbus;
    const { notifications } = window.HeroContract;
    const host    = shadowDocument.host;
    const nameEl  = shadowDocument.getElementById('p-name');
    const levelEl = shadowDocument.getElementById('p-level');
    const floorEl = shadowDocument.getElementById('p-floor');
    const hpBar   = shadowDocument.getElementById('p-hp-bar');
    const hpText  = shadowDocument.getElementById('p-hp-text');
    const xpBar   = shadowDocument.getElementById('p-xp-bar');
    const xpText  = shadowDocument.getElementById('p-xp-text');
    const atkEl   = shadowDocument.getElementById('p-atk');
    const defEl   = shadowDocument.getElementById('p-def');
    const goldEl  = shadowDocument.getElementById('p-gold');

    busListen(notifications.STATE, (e) => {
        const { hero, floor } = e.detail;
        nameEl.textContent  = hero.name;
        levelEl.textContent = `Lv ${hero.level}`;
        floorEl.textContent = `Floor ${floor}`;

        const hpPct = Math.max(0, (hero.hp / hero.maxHp) * 100);
        hpBar.style.width  = `${hpPct}%`;
        hpBar.className    = 'bar-fill' + (hpPct < 30 ? ' danger' : hpPct < 60 ? ' warn' : ' ok');
        hpText.textContent = `${hero.hp}/${hero.maxHp}`;

        const xpPct = Math.min(100, (hero.xp / hero.xpNext) * 100);
        xpBar.style.width  = `${xpPct}%`;
        xpText.textContent = `${hero.xp}/${hero.xpNext}`;

        atkEl.textContent  = hero.attack;
        defEl.textContent  = hero.defense;
        goldEl.textContent = hero.gold;
    }, host);
</script>

    .avatar { font-size: 2.8rem; filter: drop-shadow(0 0 6px #ffd70066); }

    .stat-block {

    .bar-track {

    .bar-fill { height: 100%; border-radius: 999px; transition: width 0.3s ease; }
    .bar-fill.ok     { background: #4caf50; }
    .bar-fill.warn   { background: #ffc107; }
    .bar-fill.danger { background: #e94560; }
